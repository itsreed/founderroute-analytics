name: Publish npm beta

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci --legacy-peer-deps
      - run: npm run release:check
      - run: npm run build
      - run: npm test
      - name: Inspect package contents
        run: |
          npm pack ./packages/browser --dry-run
          npm pack ./packages/node --dry-run
          npm pack ./packages/react-native --dry-run
      - name: Publish beta packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./packages/browser --access public --tag beta
          npm publish ./packages/node --access public --tag beta
          npm publish ./packages/react-native --access public --tag beta
