name: Publish npm release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci --legacy-peer-deps
      - run: npm run release:check
        env:
          REQUIRE_RELEASE_TAG: "true"
      - run: npm run build
      - run: npm test
      - name: Inspect package contents
        run: |
          npm pack ./packages/browser --dry-run
          npm pack ./packages/node --dry-run
          npm pack ./packages/react-native --dry-run
      - name: Publish packages with the manifest distribution tag
        run: node scripts/publish-npm.mjs
