name: Publish validated Maven deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Maven Central deployment ID returned by the staging workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-release
    steps:
      - name: Publish exact validated deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "Invalid Maven Central deployment ID."
            exit 1
          }

          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            test -n "${!name}" || {
              echo "Missing GitHub secret: $name"
              exit 1
            }
          done

          AUTH="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          STATUS_URL="https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}"
          DEPLOYMENT_URL="https://central.sonatype.com/api/v1/publisher/deployment/${DEPLOYMENT_ID}"

          read_status() {
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $AUTH" \
              "$STATUS_URL"
          }

          state=""
          status_json=""
          for attempt in $(seq 1 30); do
            status_json="$(read_status)"
            returned_id="$(jq -r '.deploymentId // empty' <<<"$status_json")"
            state="$(jq -r '.deploymentState // empty' <<<"$status_json")"

            test "$returned_id" = "$DEPLOYMENT_ID" || {
              echo "Maven Central returned a different deployment ID."
              exit 1
            }

            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED)
                break
                ;;
              FAILED)
                echo "Maven Central validation failed."
                jq '{deploymentId, deploymentState, errors}' <<<"$status_json"
                exit 1
                ;;
              PENDING|VALIDATING)
                echo "Waiting for Maven Central validation ($state, attempt $attempt/30)."
                sleep 10
                ;;
              *)
                echo "Unexpected Maven Central deployment state: ${state:-missing}"
                exit 1
                ;;
            esac
          done

          if test "$state" = "VALIDATED"; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $AUTH" \
              "$DEPLOYMENT_URL"
            echo "Maven Central accepted the publish request."
          elif test "$state" = "PUBLISHED"; then
            echo "Maven Central deployment is already published."
          elif test "$state" != "PUBLISHING"; then
            echo "Deployment did not become publishable before the validation timeout."
            exit 1
          fi

          for attempt in $(seq 1 60); do
            status_json="$(read_status)"
            state="$(jq -r '.deploymentState // empty' <<<"$status_json")"

            case "$state" in
              PUBLISHED)
                echo "Maven Central publication completed."
                jq '{deploymentId, deploymentName, deploymentState, purls}' <<<"$status_json"
                exit 0
                ;;
              FAILED)
                echo "Maven Central publication failed."
                jq '{deploymentId, deploymentState, errors}' <<<"$status_json"
                exit 1
                ;;
              PUBLISHING|VALIDATED)
                echo "Waiting for Maven Central publication ($state, attempt $attempt/60)."
                sleep 10
                ;;
              *)
                echo "Unexpected Maven Central deployment state: ${state:-missing}"
                exit 1
                ;;
            esac
          done

          echo "Maven Central publication did not complete before the timeout."
          exit 1
