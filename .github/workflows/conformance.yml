name: SDK conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: node --test e2e/browser.spec.mjs
  react-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
      - name: Create consumer application from the packaged SDK
        shell: bash
        run: |
          npm run build
          RN_PACKAGE="$(npm pack ./packages/react-native --pack-destination "$RUNNER_TEMP" | tail -1)"
          npx --yes @react-native-community/cli@20.0.0 init AnalyticsExample --version 0.81.4 --pm npm --skip-install --skip-git-init --directory "$RUNNER_TEMP/AnalyticsExample"
          cd "$RUNNER_TEMP/AnalyticsExample"
          npm install "$RUNNER_TEMP/$RN_PACKAGE"
          cp "$GITHUB_WORKSPACE/examples/react-native/App.jsx" ./AnalyticsExample.jsx
          cat > App.tsx <<'EXAMPLE'
          import React from 'react';
          import Example from './AnalyticsExample';
          export default function App(){return <Example configuration={{endpoint:'https://collector.example.invalid',ios:{key:'fr_pk_REPLACE_WITH_PUBLIC_IOS_KEY',appId:'example.founderroute'},android:{key:'fr_pk_REPLACE_WITH_PUBLIC_ANDROID_KEY',appId:'example.founderroute'}}}/>;}
          EXAMPLE
          npx react-native config > "$RUNNER_TEMP/react-native-config.json"
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/react-native-config.json"));if(!c.dependencies["@founderroute/analytics-react-native"]?.platforms?.android || !c.dependencies["@founderroute/analytics-react-native"]?.platforms?.ios)process.exit(1)'
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/analytics-example.bundle"
      - name: Build Android consumer with autolinking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/AnalyticsExample/android"
          ./gradlew --no-daemon assembleDebug -PreactNativeArchitectures=x86_64
      - name: Build iOS consumer with autolinking
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/AnalyticsExample/ios"
          pod install
          xcodebuild -workspace AnalyticsExample.xcworkspace -scheme AnalyticsExample -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/react-native-ios.log" 2>&1 || { tail -150 "$RUNNER_TEMP/react-native-ios.log"; exit 1; }
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm pack ./packages/browser --dry-run && npm pack ./packages/node --dry-run && npm pack ./packages/react-native --dry-run
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -scheme FounderRouteAnalytics -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Build standalone SwiftUI and UIKit example
        run: |
          brew install xcodegen
          cd examples/ios
          xcodegen generate
          xcodebuild -project AnalyticsExample.xcodeproj -scheme AnalyticsExample -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-example.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-example.log"; exit 1; }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android release and Maven Central bundle layout
        run: |
          gradle --no-daemon -p android test assembleRelease publishReleasePublicationToCentralBundleRepository
          test -f android/build/central-bundle/app/founderroute/analytics-android/0.1.0-beta01/analytics-android-0.1.0-beta01.aar
          test -f android/build/central-bundle/app/founderroute/analytics-android/0.1.0-beta01/analytics-android-0.1.0-beta01-sources.jar
          test -f android/build/central-bundle/app/founderroute/analytics-android/0.1.0-beta01/analytics-android-0.1.0-beta01-javadoc.jar
          test -f android/build/central-bundle/app/founderroute/analytics-android/0.1.0-beta01/analytics-android-0.1.0-beta01.pom
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle --no-daemon -p android connectedCheck
